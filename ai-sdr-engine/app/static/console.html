<!doctype html>
<!-- app/static/console.html - Azentio Sales Workspace: AI SDR leads, approvals, opportunities, campaigns and insights -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Sales Workspace | Azentio</title>
<link rel="icon" href="/assets/azentio-logo.svg" />
<style>
@font-face { font-family: Poppins; font-weight: 400; font-display: swap; src: url(/assets/fonts/Poppins-Regular.woff2) format("woff2"); }
@font-face { font-family: Poppins; font-weight: 500; font-display: swap; src: url(/assets/fonts/Poppins-Medium.woff2) format("woff2"); }
@font-face { font-family: Poppins; font-weight: 600; font-display: swap; src: url(/assets/fonts/Poppins-SemiBold.woff2) format("woff2"); }

:root {
  --ink: #16303d; --ink-2: #2b4654; --ink-soft: #e8eef0; --mint: #55ffbe; --mint-soft: #ddfff2; --mint-ink: #0b6b47;
  --paper: #f5f7f7; --white: #fff; --muted: #5b6d75; --line: #dde5e7; --line-strong: #c6d2d5;
  --amber-soft: #fff3dc; --amber-ink: #8a5300; --red-soft: #fde8e8; --red-ink: #a42727; --blue-soft: #e7f0fb; --blue-ink: #1d4f8c;
  --radius: 12px; --radius-sm: 8px; --shadow: 0 1px 2px rgb(22 48 61 / .05), 0 4px 16px rgb(22 48 61 / .05);
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 14px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
#main:focus, #main:focus-visible { outline: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -40px; background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 12px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; } svg.i.lg { width: 22px; height: 22px; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 40; background: var(--white); border-bottom: 1px solid var(--line); }
.topbar-inner { height: 68px; display: flex; align-items: center; gap: 28px; padding: 0 28px; max-width: 1680px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; flex: none; }
.brand img { height: 30px; width: auto; display: block; }
.brand-sep { width: 1px; height: 24px; background: var(--line-strong); }
.brand-name { font-weight: 500; font-size: 14px; color: var(--ink); white-space: nowrap; }
.nav { display: flex; gap: 4px; height: 100%; }
.nav a { display: flex; align-items: center; gap: 8px; padding: 0 14px; text-decoration: none; font-weight: 500; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; transition: color .15s var(--ease), border-color .15s var(--ease); white-space: nowrap; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink-soft); color: var(--ink); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
.count.hot { background: var(--mint); color: var(--ink); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.avatar-me { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--mint); display: grid; place-items: center; font-weight: 600; font-size: 12px; }

/* Buttons */
.btn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-weight: 500; font-size: 13px; white-space: nowrap; transition: background .15s var(--ease), transform .1s var(--ease), opacity .15s; text-decoration: none; }
.btn:hover { background: var(--ink-2); }
.btn:active { transform: scale(.98); }
.btn.mint { background: var(--mint); border-color: var(--mint); color: var(--ink); }
.btn.mint:hover { background: #3ef0ac; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--ink-soft); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink); padding: 0 10px; }
.btn.quiet:hover { background: var(--ink-soft); }
.btn.danger { background: transparent; color: var(--red-ink); border-color: transparent; }
.btn.danger:hover { background: var(--red-soft); }
.btn.sm { min-height: 34px; padding: 0 14px; font-size: 12.5px; }
.btn[disabled], .btn[aria-busy="true"] { opacity: .5; cursor: not-allowed; }
.btn .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Menus */
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 260px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 32px rgb(22 48 61 / .14); padding: 6px; display: none; z-index: 50; }
.menu.open { display: block; animation: pop .16s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.menu button { width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 10px 12px; border: 0; background: none; border-radius: 8px; }
.menu button:hover { background: var(--paper); }
.menu small { display: block; color: var(--muted); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu .menu-note { padding: 8px 12px 4px; font-size: 11.5px; color: var(--muted); }

/* Page */
main { max-width: 1680px; margin: 0 auto; padding: 28px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
.eyebrow { display: flex; align-items: center; gap: 10px; text-transform: uppercase; font-size: 11px; letter-spacing: 1.6px; font-weight: 500; color: var(--muted); margin: 0 0 8px; }
.eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--ink); }
h1 { font-size: 30px; line-height: 1.2; font-weight: 600; margin: 0; letter-spacing: -.3px; }
h1 .u { background: linear-gradient(transparent 72%, var(--mint) 72%); }
.lede { color: var(--muted); margin: 8px 0 0; max-width: 640px; }
h2 { font-size: 18px; font-weight: 600; margin: 0; }
h3 { font-size: 14px; font-weight: 600; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

.card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 0; }
.card-body { padding: 16px 20px 20px; }
.card + .card { margin-top: 16px; }

/* Leads layout */
.leads-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr) 290px; gap: 20px; align-items: start; }
.list-pane { position: sticky; top: 92px; max-height: calc(100vh - 116px); display: flex; flex-direction: column; overflow: hidden; }
.list-tools { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 14px; height: 40px; color: var(--muted); }
.search input { border: 0; outline: 0; flex: 1; background: transparent; color: var(--ink); min-width: 0; }
.segs { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 500; color: var(--muted); }
.seg[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.lead-list { overflow-y: auto; flex: 1; }
.lead-row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: none; border-left: 3px solid transparent; width: 100%; text-align: left; border-right: 0; border-top: 0; transition: background .12s; }
.lead-row:hover { background: var(--paper); }
.lead-row[aria-current="true"] { background: #f0f6f5; border-left-color: var(--ink); }
.lead-row .name { font-weight: 600; font-size: 13.5px; }
.lead-row .co { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead-row .meta { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.lead-row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.av { width: 40px; height: 40px; border-radius: 50%; background: var(--ink-soft); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.av.lg { width: 56px; height: 56px; font-size: 18px; background: var(--ink); color: var(--mint); }
.dot-alert { width: 8px; height: 8px; border-radius: 50%; background: #18c27f; box-shadow: 0 0 0 3px var(--mint-soft); }
.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty .ico { width: 52px; height: 52px; border-radius: 50%; background: var(--mint-soft); color: var(--mint-ink); display: grid; place-items: center; margin: 0 auto 14px; }
.empty h3 { color: var(--ink); font-size: 16px; margin-bottom: 6px; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--ink-soft); color: var(--ink); }
.badge.mint { background: var(--mint-soft); color: var(--mint-ink); }
.badge.amber { background: var(--amber-soft); color: var(--amber-ink); }
.badge.red { background: var(--red-soft); color: var(--red-ink); }
.badge.blue { background: var(--blue-soft); color: var(--blue-ink); }
.badge.ink { background: var(--ink); color: var(--mint); }
.badge.grey { background: #eef1f2; color: #5b6d75; }
.badge.outline { background: #fff; border: 1px solid var(--line-strong); color: var(--ink-2); }
.fit { font-weight: 600; font-size: 11.5px; padding: 3px 9px; border-radius: 6px; }
.fit.High { background: var(--mint-soft); color: var(--mint-ink); }
.fit.Medium { background: var(--amber-soft); color: var(--amber-ink); }
.fit.Low { background: #eef1f2; color: #5b6d75; }

/* Detail */
.detail { min-width: 0; }
.profile { display: flex; gap: 18px; align-items: flex-start; padding: 22px; }
.profile .who { flex: 1; min-width: 0; }
.profile h2 { font-size: 22px; }
.profile .sub { color: var(--muted); margin-top: 2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.owner { text-align: right; display: grid; gap: 8px; justify-items: end; }
.next { display: flex; gap: 16px; align-items: center; padding: 18px 22px; border-radius: var(--radius); background: var(--ink); color: #fff; margin: 16px 0; }
.next .ico { width: 40px; height: 40px; border-radius: 50%; background: var(--mint); color: var(--ink); display: grid; place-items: center; flex: none; }
.next .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: #a9c2cb; }
.next .text { font-weight: 500; font-size: 15px; }
.next .next-cta { margin-left: auto; }
.next.calm { background: var(--white); color: var(--ink); border: 1px solid var(--line); }
.next.calm .label { color: var(--muted); }
.next.calm .ico { background: var(--ink-soft); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 26px 0 12px; }
.section-title h2 { font-size: 16px; }

/* Email composer */
.email { overflow: hidden; }
.email-top { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: #fbfcfc; }
.email-top .kind { font-weight: 600; font-size: 13px; }
.email-fields { padding: 4px 20px 0; }
.email-row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); min-height: 46px; }
.email-row label { color: var(--muted); font-size: 12.5px; }
.email-row input { border: 0; outline: 0; padding: 12px 0; font-weight: 500; background: transparent; width: 100%; }
.email-row .to { padding: 12px 0; }
.email textarea { width: 100%; border: 0; outline: 0; resize: vertical; padding: 16px 20px; min-height: 220px; line-height: 1.65; background: transparent; }
.email-row:focus-within, .email textarea:focus { background: #fbfdfc; }
.email-foot { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.email-foot .spacer { flex: 1; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 20px; font-size: 13px; }
.notice.amber { background: var(--amber-soft); color: var(--amber-ink); }
.notice.mint { background: var(--mint-soft); color: var(--mint-ink); }
.notice.grey { background: var(--paper); color: var(--muted); }
.research-sources { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.research-sources summary { cursor: pointer; font-weight: 500; }
.research-source { margin-top: 12px; }
.research-source a { text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
.research-source blockquote { margin: 6px 0 0; padding-left: 12px; border-left: 2px solid var(--line-strong); color: var(--muted); font-size: 12px; white-space: pre-line; }

/* BANT */
.score { display: flex; align-items: baseline; gap: 6px; }
.score b { font-size: 26px; font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--ink-soft); overflow: hidden; margin-top: 6px; }
.bar > span { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width .4s var(--ease); }
.bar.mint > span { background: #18c27f; }
.bant { display: grid; gap: 10px; margin-top: 14px; }
.bant-item { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.bant-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.bant-ico.confirmed { background: var(--mint-soft); color: var(--mint-ink); }
.bant-ico.inferred { background: var(--amber-soft); color: var(--amber-ink); }
.bant-ico.missing { background: #eef1f2; color: #8a979d; }
.bant-ico.conflict { background: var(--red-soft); color: var(--red-ink); }
.bant-item .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.bant-item .lbl { font-weight: 600; font-size: 13px; }
.quote { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--mint); font-size: 13px; color: var(--ink-2); }
.quote cite { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.checks { display: grid; gap: 2px; margin-top: 12px; }
.check { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.check:last-child { border-bottom: 0; }
.check .ci { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.check .ci.ok { background: var(--mint-soft); color: var(--mint-ink); }
.check .ci.no { background: var(--red-soft); color: var(--red-ink); }
.check .ci.part { background: var(--amber-soft); color: var(--amber-ink); }
.check .ttl { font-weight: 600; font-size: 12.5px; }
.check .pts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
.fact .k { font-size: 11.5px; color: var(--muted); }
.fact .v { font-weight: 500; }

/* Conversation */
.thread { display: grid; gap: 14px; }
.msg { max-width: 82%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: #fff; white-space: pre-wrap; }
.msg.out { justify-self: end; background: #f2f7f8; border-color: #dbe7ea; border-bottom-right-radius: 4px; }
.msg.in { justify-self: start; border-bottom-left-radius: 4px; border-color: #bff3dc; background: #f7fffb; }
.msg .mhead { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: normal; }
.msg .mhead b { color: var(--ink); font-weight: 600; }
.msg .msub { font-weight: 600; margin-bottom: 6px; }
.reply-box { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
.reply-box summary { cursor: pointer; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; list-style: none; }
.reply-box summary::-webkit-details-marker { display: none; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.chip-btn { border: 1px solid var(--line-strong); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12px; }
.chip-btn:hover { background: var(--ink-soft); }
textarea.field, input.field, select.field { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; background: #fff; outline: 0; transition: border-color .15s; }
textarea.field:focus, input.field:focus, select.field:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgb(22 48 61 / .08); }
.row-end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

/* Handoff */
.handoff { border: 1px solid #9eeccb; background: linear-gradient(180deg, #f3fff9, #fff 60%); }
.task { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; }
.task .ico { width: 36px; height: 36px; border-radius: 50%; background: var(--ink-soft); display: grid; place-items: center; flex: none; }
.task .body { flex: 1; min-width: 0; }
.task .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* Activity rail */
.rail { position: sticky; top: 92px; max-height: calc(100vh - 116px); display: flex; flex-direction: column; overflow: hidden; }
.rail-list { overflow-y: auto; padding: 4px 16px 16px; }
.act { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); animation: slide .25s var(--ease); }
@keyframes slide { from { opacity: 0; transform: translateY(-6px); } }
.act .ai { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--ink-soft); }
.act .ai.mint { background: var(--mint-soft); color: var(--mint-ink); }
.act .ai.amber { background: var(--amber-soft); color: var(--amber-ink); }
.act .at { font-size: 13px; line-height: 1.45; }
.act .when { font-size: 11.5px; color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--mint-ink); font-weight: 500; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #18c27f; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* Approvals / Opportunities / Campaigns */
.queue { display: grid; gap: 14px; }
.q-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 16px; padding: 18px 20px; align-items: start; }
.q-item .preview { color: var(--ink-2); font-size: 13px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.q-item .acts { display: flex; gap: 8px; align-items: center; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.opp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.opp { padding: 20px; display: grid; gap: 14px; }
.opp .ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 18px; background: conic-gradient(#18c27f calc(var(--v) * 1%), var(--ink-soft) 0); position: relative; flex: none; }
.opp .ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #fff; }
.opp .ring span { position: relative; }
.camp-layout { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 20px; align-items: start; }
.tpl { display: grid; gap: 10px; }
.tpl button { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: var(--radius-sm); padding: 14px; display: grid; gap: 4px; transition: border-color .15s, background .15s; }
.tpl button:hover { border-color: var(--ink); }
.tpl button[aria-pressed="true"] { border-color: var(--ink); background: #f0f6f5; box-shadow: inset 3px 0 0 var(--ink); }
.form-grid { display: grid; gap: 14px; }
.form-grid.two { grid-template-columns: 1fr 1fr; }
.fld { display: grid; gap: 6px; }
.fld > span { font-size: 12.5px; font-weight: 500; }
.fld .help { font-size: 12px; color: var(--muted); }
.req { color: var(--red-ink); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.camp-row { padding: 20px; display: grid; gap: 14px; }
.camp-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--paper); border-radius: var(--radius-sm); padding: 12px 14px; }
.stat b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.excl { font-size: 12.5px; color: var(--muted); }
.excl li { margin: 4px 0; }

/* Insights */
