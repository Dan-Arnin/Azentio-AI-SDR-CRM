# Render Blueprint: Dashboard → New → Blueprint → pick this repo. Both services use the free plan.
# Values marked sync: false are secrets: Render asks for them on first deploy; they never live in git.
services:
  # CRM backend (FastAPI + PostgreSQL). Applies db/migrations and db/seed on every start (idempotent).
  - type: web
    name: azentio-sdr-backend
    runtime: docker
    plan: free
    region: singapore # keep in the same region as the Neon database
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL # Neon "direct" connection string, ending in ?sslmode=require
        sync: false
      - key: CORS_ORIGIN # comma-separated; add the Vercel URL once the frontend is live
        value: http://localhost:3000
      - key: DECISION_PROVIDER
        value: fixture
      - key: EMAIL_TRANSPORT
        value: simulated
      - key: CRM_WEBHOOK_SECRET # signs engine → CRM webhooks; Render generates it and shares it with the engine
        generateValue: true
      - key: ENGINE_URL # engine base URL, e.g. https://azentio-sdr-engine.onrender.com (used by POST /v1/crm/resync)
        sync: false

  # AI SDR engine (contact form, sales workspace, /v1 workflow API). Stores its data in Neon (schema "engine"),
  # so leads, drafts and campaigns survive deploys, restarts and sleep. Without ENGINE_DATABASE_URL it falls back to SQLite.
  - type: web
    name: azentio-sdr-engine
    runtime: python
    plan: free
    region: singapore # keep in the same region as the Neon database
    rootDir: ai-sdr-engine
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run --frozen uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENGINE_DATABASE_URL # same Neon database as the backend; engine tables live in their own schema
        fromService:
          type: web
          name: azentio-sdr-backend
          envVarKey: DATABASE_URL
      - key: ENGINE_DB_SCHEMA
        value: engine
      - key: OPENAI_API_KEY # optional: without it the engine runs in fixture mode and routes more leads to human review
        sync: false
      - key: LLM_BACKEND
        value: api_key
      - key: EMAIL_TRANSPORT # switch to resend (plus RESEND_API_KEY, DEMO_INBOX) only for the controlled inbox
        value: simulated
      - key: DEMO_MODE
        value: "true"
      - key: SDR_PUBLIC_BASE_URL # this service's own URL, used for workspace links in enquiry notification emails
        sync: false
      - key: ENRICHMENT_PROVIDER # demo profiles; set to apollo (plus APOLLO_API_KEY) for live lookups of real domains
        value: demo
      - key: APOLLO_API_KEY # optional
        sync: false
      - key: CRM_WEBHOOK_URL # backend URL + /v1/crm/events, e.g. https://azentio-sdr-backend.onrender.com/v1/crm/events
        sync: false
      - key: CONSOLE_PASSWORD # demo sign-in for the Trust page (Render generates it: Environment tab -> reveal, share with judges)
        generateValue: true
      - key: SESSION_SECRET # signs console sessions
        generateValue: true
      - key: CRM_WEBHOOK_SECRET
        fromService:
          type: web
          name: azentio-sdr-backend
          envVarKey: CRM_WEBHOOK_SECRET
