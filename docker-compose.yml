services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sdr
      POSTGRES_PASSWORD: sdr
      POSTGRES_DB: sdr
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://sdr:sdr@postgres:5432/sdr
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["./db:/srv/db:ro", "./fixtures:/srv/fixtures:ro"]

volumes:
  pgdata:
